name: Mobile

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "ios/**"
      - "native/**"
      - "capacitor.config.ts"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "ios/**"
      - "native/**"
      - "capacitor.config.ts"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: Also archive the iPhone app and upload it to TestFlight
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (Google Play bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload.jks
            echo "ANDROID_KEYSTORE_PATH=app/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set — the release bundle is unsigned and cannot go to Play."
          fi
      - name: Screen tests, lint, bundle and debug APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:bundleRelease :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: aisle-scout-android-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens-and-reports-${{ github.run_number }}
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/
          retention-days: 7

  ios:
    name: iOS (App Store shell)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-aisle
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build for the simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  ios-testflight:
    name: iOS → TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — see store/README.md (App Store section)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-aisle
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: App Store Connect key and export options
        run: |
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
      - name: Archive (signed by Xcode with the API key)
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
