name: Android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: Test, lint and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Signing runs only when the upload-key secrets exist (see store/google-play.md).
      HAS_UPLOAD_KEY: ${{ secrets.AISLE_SCOUT_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.AISLE_SCOUT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "AISLE_SCOUT_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Screen tests, lint, release bundle
        env:
          AISLE_SCOUT_KEYSTORE_PASSWORD: ${{ secrets.AISLE_SCOUT_KEYSTORE_PASSWORD }}
          AISLE_SCOUT_KEY_ALIAS: ${{ secrets.AISLE_SCOUT_KEY_ALIAS }}
          AISLE_SCOUT_KEY_PASSWORD: ${{ secrets.AISLE_SCOUT_KEY_PASSWORD }}
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintRelease :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_UPLOAD_KEY == 'true' && 'aisle-scout-release-signed' || 'aisle-scout-release-unsigned' }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens-and-reports
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/
          retention-days: 7
