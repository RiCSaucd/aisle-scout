name: Setup Aisle Scout
description: Install Node and npm dependencies with cache
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Install
      shell: bash
      run: npm ci
